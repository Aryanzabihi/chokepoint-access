{% macro field_input(field, value) %}
  <div class="field" style="width:210px">
    <label for="field_{{ field.name }}">{{ display_label(field.name) }}</label>
    {% if field.unit in ('fraction_pa', 'fraction') %}
      <input type="number" id="field_{{ field.name }}" name="field_{{ field.name }}" step="0.01"
             value="{{ (value * 100)|round(2) if value is not none else '' }}">
      <p class="hint">% &mdash; {{ field.system_of_record }}</p>
    {% else %}
      <input type="number" id="field_{{ field.name }}" name="field_{{ field.name }}" step="any"
             value="{{ value if value is not none else '' }}">
      <p class="hint">{{ field.unit }} &mdash; {{ field.system_of_record }}</p>
    {% endif %}
  </div>
{% endmacro %}
