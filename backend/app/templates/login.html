{% extends "base.html" %}
{% block title %}Log in — Chokepoint Access{% endblock %}
{% block content %}
<header class="masthead">
  <div class="eyebrow">Client portfolio</div>
  <h1>Log in</h1>
</header>

<form class="panel" method="post" action="/login" style="max-width:420px">
  {% if error %}<p class="note hot">{{ error }}</p>{% endif %}
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autocomplete="email">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <button class="btn" type="submit">Log in</button>
  <p class="hint" style="margin-top:var(--s4)">No account yet? <a href="/signup">Sign up</a>.</p>
</form>
{% endblock %}
