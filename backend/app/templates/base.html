<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chokepoint Access — client portfolio{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
</head>
<body>
<div class="wrap">
<nav class="nav">
  <a href="/home" class="{{ 'here' if active == 'home' else '' }}">Home</a>
  <a href="/orders" class="{{ 'here' if active == 'orders' else '' }}">Orders</a>
  <a href="/strategy-decisions" class="{{ 'here' if active == 'strategy-decisions' else '' }}">Decisions</a>
  <a href="/corridors" class="{{ 'here' if active == 'corridors' else '' }}">Corridors</a>
  <a href="/account/api-keys" class="{{ 'here' if active == 'api-keys' else '' }}">API keys</a>
  <a href="/settings" class="{{ 'here' if active == 'settings' else '' }}">Settings</a>
  <a href="https://aryanzabihi.github.io/chokepoint-access/map.html" target="_blank" rel="noopener">Map</a>
  <span class="spacer"></span>
  <a class="btn" href="/decisions/new" style="padding:6px 12px">+ New decision</a>
  {% if user %}
    <span class="stamp">{{ user.email }}</span>
    <form method="post" action="/logout" style="display:inline;margin:0">
      <button class="btn ghost" type="submit" style="padding:4px 10px">Log out</button>
    </form>
  {% endif %}
</nav>

{% block content %}{% endblock %}

<footer class="foot">
  <span>Chokepoint Access &mdash; client portfolio</span>
  <span class="spacer"></span>
  <span>Phase 5, commercial infrastructure</span>
</footer>
</div>
</body>
</html>
